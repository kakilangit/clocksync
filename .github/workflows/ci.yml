name: "CI"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-ci:
    name: Rust Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.88
          components: rustfmt,clippy

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: make fmt-check

      - name: Clippy lint
        run: make clippy

      - name: Run tests
        run: make test

      - name: Run doc tests
        run: make test-doc
